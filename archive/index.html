<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⛁ Archive</title>
<meta name="description" content="A private archive of playables.">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><circle cx="32" cy="32" r="29" fill="%23141619" stroke="%23e6b450" stroke-width="6"/><circle cx="32" cy="32" r="12" fill="%230a0b0d" stroke="%23e6b450" stroke-width="3"/><g stroke="%23e6b450" stroke-width="5" stroke-linecap="round"><line x1="32" y1="4" x2="32" y2="14"/><line x1="32" y1="50" x2="32" y2="60"/><line x1="4" y1="32" x2="14" y2="32"/><line x1="50" y1="32" x2="60" y2="32"/><line x1="12.2" y1="12.2" x2="19.3" y2="19.3"/><line x1="44.7" y1="44.7" x2="51.8" y2="51.8"/><line x1="12.2" y1="51.8" x2="19.3" y2="44.7"/><line x1="44.7" y1="19.3" x2="51.8" y2="12.2"/></g></svg>'>
<link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

<!-- ============ ACCESS GATE ============ -->
<div id="gate">
  <div class="gate-card">
    <div class="gate-logo" aria-hidden="true">
      <svg viewBox="0 0 64 64" width="56" height="56"><circle cx="32" cy="32" r="29" fill="#141619" stroke="#e6b450" stroke-width="6"/><circle cx="32" cy="32" r="12" fill="#0a0b0d" stroke="#e6b450" stroke-width="3"/><g stroke="#e6b450" stroke-width="5" stroke-linecap="round"><line x1="32" y1="4" x2="32" y2="14"/><line x1="32" y1="50" x2="32" y2="60"/><line x1="4" y1="32" x2="14" y2="32"/><line x1="50" y1="32" x2="60" y2="32"/><line x1="12.2" y1="12.2" x2="19.3" y2="19.3"/><line x1="44.7" y1="44.7" x2="51.8" y2="51.8"/><line x1="12.2" y1="51.8" x2="19.3" y2="44.7"/><line x1="44.7" y1="19.3" x2="51.8" y2="12.2"/></g></svg>
    </div>
    <h1 class="gate-title">⛁ Archive</h1>
    <p class="gate-sub">This library is private. Enter your access key to continue.</p>
    <form id="gate-form" autocomplete="off">
      <input id="gate-input" type="password" placeholder="Access key" maxlength="24" spellcheck="false" autocomplete="off">
      <button type="submit" class="btn btn-primary btn-block" id="gate-btn">Unlock</button>
    </form>
    <p class="gate-hint">A device only needs to be unlocked once.</p>
    <p class="gate-error" id="gate-error" hidden></p>
  </div>
</div>

<!-- ============ APP SHELL ============ -->
<div id="app" hidden>
  <div id="scrim"></div>
  <aside id="sidebar">
    <div class="brand-row">
      <a class="brand" href="#/home">
        <svg viewBox="0 0 64 64" width="26" height="26" aria-hidden="true"><circle cx="32" cy="32" r="29" fill="#141619" stroke="#e6b450" stroke-width="6"/><circle cx="32" cy="32" r="12" fill="#0a0b0d" stroke="#e6b450" stroke-width="3"/><g stroke="#e6b450" stroke-width="5" stroke-linecap="round"><line x1="32" y1="4" x2="32" y2="14"/><line x1="32" y1="50" x2="32" y2="60"/><line x1="4" y1="32" x2="14" y2="32"/><line x1="50" y1="32" x2="60" y2="32"/><line x1="12.2" y1="12.2" x2="19.3" y2="19.3"/><line x1="44.7" y1="44.7" x2="51.8" y2="51.8"/><line x1="12.2" y1="51.8" x2="19.3" y2="44.7"/><line x1="44.7" y1="19.3" x2="51.8" y2="12.2"/></g></svg>
        <span>Archive</span>
      </a>
      <button id="side-collapse" title="Collapse sidebar" aria-label="Collapse sidebar">
        <svg viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h16"/></svg>
      </button>
    </div>
    <nav id="nav">
      <a href="#/home" data-nav="home" title="Home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h5v-6h4v6h5V9.5"/></svg><span>Home</span></a>
      <a href="#/library" data-nav="library" title="Library"><svg viewBox="0 0 24 24"><path d="M4 4h5v16H4zM10.5 4h3v16h-3z"/><path d="m15 4.5 4.5 15 2-.6-4.5-15z"/></svg><span>Library</span></a>
      <a href="#/store" data-nav="store" title="Store"><svg viewBox="0 0 24 24"><path d="M4 7h16l-1.5 13h-13z"/><path d="M8.5 10V6a3.5 3.5 0 0 1 7 0v4"/></svg><span>Store</span></a>
      <a href="#/emulation" data-nav="emulation" title="Emulation"><svg viewBox="0 0 24 24"><path d="M6 9h12v9a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2z"/><path d="M6 9 4.5 5h15L18 9"/><path d="M9 13h.01M15 13h.01M9.5 16.5c1 .8 4 .8 5 0"/></svg><span>Emulation</span></a>
      <a href="#/settings" data-nav="settings" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.5-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.4 2.6a7 7 0 0 0-2 1.2l-2.5-1-2 3.5 2 1.5a7.7 7.7 0 0 0 0 2.4l-2 1.5 2 3.5 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.4-2.6a7 7 0 0 0 2-1.2l2.5 1 2-3.5-2-1.5c.06-.4.1-.8.1-1.2z"/></svg><span>Settings</span></a>
    </nav>
    <div class="side-section" id="side-favs-wrap" hidden>
      <div class="side-label">Favorites</div>
      <div id="side-favs"></div>
      <a class="side-more" href="#/library">See all</a>
    </div>
  </aside>

  <main id="main">
    <header id="topbar">
      <button id="menu-btn" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div id="page-title">Home</div>
      <div class="topbar-actions">
        <button class="icon-btn" id="search-btn" title="Search (Ctrl+K)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/></svg></button>
        <button class="icon-btn" id="ac-btn" title="Auto clicker (Alt+A)"><svg viewBox="0 0 24 24"><path d="M9 3.5v7L4.8 18a2.4 2.4 0 0 0 2 3.5h10.4a2.4 2.4 0 0 0 2-3.5L15 10.5v-7z"/><path d="M7 3.5h10"/></svg></button>
        <a class="icon-btn" id="settings-btn" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.5-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.4 2.6a7 7 0 0 0-2 1.2l-2.5-1-2 3.5 2 1.5a7.7 7.7 0 0 0 0 2.4l-2 1.5 2 3.5 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.4-2.6a7 7 0 0 0 2-1.2l2.5 1 2-3.5-2-1.5c.06-.4.1-.8.1-1.2z"/></svg></a>
      </div>
    </header>
    <div id="view"></div>
  </main>
</div>

<!-- ============ OVERLAYS ============ -->
<div id="search-overlay" class="overlay" hidden>
  <div class="search-panel">
    <svg class="search-ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/></svg>
    <input id="search-input" placeholder="Search 1,700+ games…" autocomplete="off" spellcheck="false">
    <button class="icon-btn" id="search-close" title="Close (Esc)"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div id="search-results" class="search-results"></div>
</div>

<div id="modal-root" hidden></div>
<div id="toast-root"></div>

<canvas id="ac-ring" hidden></canvas>

<script src="assets/js/data.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/tools.js"></script>
<script src="assets/js/dev.js"></script>
<script src="assets/js/uploads.js"></script>
<script src="assets/js/player.js"></script>
<script src="assets/js/emulate.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
